[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-diet"
version = "1.0.0"
description = "PDF compression on a permissively licensed stack: an open-source take on pdf-tools optimizeDocument"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Pitch Software GmbH" }]
keywords = ["pdf", "compression", "optimization", "pikepdf", "downsample"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pikepdf>=8.0",
    "pillow>=10.0",
]

[project.scripts]
"pdf-diet" = "pdfdiet.cli:main"

[project.urls]
Homepage = "https://github.com/pitch-io/pdf-diet"
Issues = "https://github.com/pitch-io/pdf-diet/issues"

# PEP 735 dependency groups. Unlike [project.optional-dependencies], these are
# never published with the package -- they exist only for people working on it.
#   uv sync                 installs runtime deps + the dev group
#   pip install --group dev same, for pip 25.1+
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdfdiet"]

# Be explicit about the sdist. Reference decks live in examples/ and are real
# customer documents running to well over a gigabyte; an allowlist keeps them
# out by construction rather than relying on .gitignore, which no longer
# excludes *.pdf.
[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "tools/",
    "*.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a couple of seconds",
    "reference: needs the reference PDFs, which are not in the repo",
]

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # The PDF object model throws a wide variety of exceptions from C++;
    # broad catches around it are deliberate and pervasive.
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pdfdiet"]

[tool.ruff.format]
# Match the existing style: the codebase uses double quotes throughout and
# hand-wrapped continuations that read better than a formatter's defaults.
quote-style = "double"
docstring-code-format = true

[tool.coverage.run]
source = ["pdfdiet"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.uv]
# Keep the resolver honest about the oldest interpreter we claim to support.
required-version = ">=0.5"
