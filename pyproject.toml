[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-diet"
version = "1.0.0"
description = "PDF compression on a permissively licensed stack: an open-source take on pdf-tools optimizeDocument"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Pitch Software GmbH" }]
keywords = ["pdf", "compression", "optimization", "pikepdf", "downsample"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pikepdf>=8.0",
    "pillow>=10.0",
]

[project.scripts]
"pdf-diet" = "pdfdiet.cli:main"

[project.urls]
Homepage = "https://github.com/pitch-io/pdf-diet"
Issues = "https://github.com/pitch-io/pdf-diet/issues"

# PEP 735 dependency groups. Unlike [project.optional-dependencies], these are
# never published with the package -- they exist only for people working on it.
#   uv sync                 installs runtime deps + the dev group
#   pip install --group dev same, for pip 25.1+
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
# Keep the resolver honest about the oldest interpreter we claim to support.
required-version = ">=0.5"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfdiet"]

# Be explicit about the sdist. Reference decks live in examples/ and are real
# customer documents running to well over a gigabyte; an allowlist keeps them
# out by construction rather than relying on .gitignore, which no longer
# excludes *.pdf.
[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "tools/",
    "*.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-vv --strict-markers --cov pdfdiet --cov-report term --cov-report html"
markers = [
    "slow: takes more than a couple of seconds",
    "reference: needs the reference PDFs, which are not in the repo",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
    "B",   # flake8 bugbear
    "C",   # flake8 comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "PL",  # pylint
    "RUF", # ruff
    "SIM", # flake8 simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "B904",    # raise-without-from-inside-except: The PDF object model throws a wide variety of exceptions from C++; broad catches around it are deliberate and pervasive.
    "BLE001",  # blind-except: allow `catch Exception:`
    "C901",    # complex-structure
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
    "PLR0917", # too-many-positional-arguments
    "PLR2004", # magic-value-comparison: TODO should remove and use constants with sensible names
    "S110",    # try-except-pass: TODO should remove this and better handle logging with a real logger
    "S112",    # try-except-continue: TODO should remove this and better handle logging with a real logger
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = [
    "PLC0415", # import-outside-top-level
]
"tests/*" = [
    "TRY002", # raise-vanilla-class
]

[tool.ruff.format]
# Match the existing style: the codebase uses double quotes throughout and
# hand-wrapped continuations that read better than a formatter's defaults.
quote-style = "double"
docstring-code-format = true

[tool.coverage.run]
source = ["pdfdiet"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
