name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Check JPEG 2000 support
        # Pillow without OpenJPEG silently drops the JPX codec, which halves
        # the codec ladder instead of failing.
        run: python -c "from PIL import features; assert features.check('jpg_2000'), 'Pillow lacks JPEG 2000 support'"
      - run: ruff check src tests
      - run: pytest --cov=pdfoptimize --cov-report=term-missing
